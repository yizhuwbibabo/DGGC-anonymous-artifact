dataset: tus_small
data_root: ${DATA_ROOT}/tus_small_benchmark
datalake_dir: ${DATA_ROOT}/tus_small_benchmark/datalake
query_dir: ${DATA_ROOT}/tus_small_benchmark/query
ground_truth: ${DATA_ROOT}/tus_small_benchmark/gt_tus_small.json
model_name: ${MODEL_NAME:-bert-base-uncased}
batch_size: 64
learning_rate: 8.0e-6
epochs: 10
max_length: 128
projection_dim: 128
lambda_reg: 0.5
alpha: 1.0
beta: 1.0
top_n: 300
eval_k: [10, 60]
